    <!-- Canonical-host consolidation: forward the *.pages.dev preview host AND
         the www subdomain to the apex domain so Google sees ONE canonical URL
         (avoids duplicate-content signal splitting). The apex never loops. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === 'mygreenhome.pages.dev' || h === 'www.mygreenhome.in') {
          location.replace('https://mygreenhome.in' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
