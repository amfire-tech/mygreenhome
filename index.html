<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Forward the *.pages.dev preview host to the real domain (one canonical
         site). Runs only on pages.dev, so the real domain never loops. -->
    <script>
      (function () {
        if (location.hostname === 'mygreenhome.pages.dev') {
          location.replace('https://mygreenhome.in' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060d09" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="MyGreenHome — Smart Gardens. Healthy Homes. Better Living. We design, set up & maintain premium indoor and outdoor gardens powered by smart technology."
    />
    <meta name="keywords" content="indoor garden design, smart garden India, plant setup, balcony garden, terrace garden, green home, MyGreenHome" />
    <link rel="canonical" href="https://www.mygreenhome.in/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="MyGreenHome" />
    <meta property="og:title" content="MyGreenHome — Smart Gardens. Healthy Homes." />
    <meta
      property="og:description"
      content="An immersive walkthrough of premium green living. We Design. We Set Up. We Maintain. You Enjoy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mygreenhome.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://www.mygreenhome.in/images/hero.jpg" />
    <meta property="og:image:alt" content="A lush smart green home at golden hour" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyGreenHome — Smart Gardens. Healthy Homes." />
    <meta name="twitter:description" content="Premium smart indoor & outdoor gardens. We Design. We Set Up. We Maintain. You Enjoy." />
    <meta name="twitter:image" content="https://www.mygreenhome.in/images/hero.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- LCP: warm up the hero background image so it paints fast -->
    <link rel="preload" as="image" href="/images/hero_home.webp" fetchpriority="high" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://www.mygreenhome.in/",
        "name": "MyGreenHome",
        "url": "https://www.mygreenhome.in/",
        "image": "https://www.mygreenhome.in/images/hero.jpg",
        "description": "MyGreenHome designs, sets up and maintains premium smart indoor & outdoor gardens — making homes healthier, calmer and more beautiful.",
        "telephone": "+91-93684-08577",
        "email": "hello@mygreenhome.in",
        "priceRange": "₹₹₹",
        "areaServed": "IN",
        "address": { "@type": "PostalAddress", "addressCountry": "IN" },
        "slogan": "Smart Gardens. Healthy Homes. Better Living."
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Cormorant Garamond (display serif) · Outfit (fallback) · Pinyon Script (series accent) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <!-- Satoshi (editorial body sans) -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
      rel="stylesheet"
    />

    <title>MyGreenHome — Smart Gardens. Healthy Homes. Better Living.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
